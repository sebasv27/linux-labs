name: CI

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Revisar scripts con ShellCheck
        run: shellcheck lab6/backup.sh lab3/saludo.sh

  probar:
    needs: lint
    runs-on: ubuntu-latest
      # ... los mismos pasos que ya tienes
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Conocer el runner
        run: |
          whoami
          pwd
          uname -a
          ls -la

      - name: Probar el script de backup
        env:
          ORIGEN: ${{ github.workspace }}/lab6/datos
          DESTINO: ${{ runner.temp }}/backups
        run: |
          chmod +x lab6/backup.sh
          ./lab6/backup.sh
          ls -l "$DESTINO"
          tar -tzf "$DESTINO"/backup-*.tar.gz

  docker:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Construir la imagen de la API
        run: docker build -t api-docker:ci docker-lab2

      - name: Probar que la API responde
        run: |
          docker run -d -p 3000:3000 --name api api-docker:ci
          sleep 3
          curl -sS --fail localhost:3000/salud
          docker logs api
