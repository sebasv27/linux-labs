name: CI

on:
  push:
    branches: [main]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Conocer el runner
        run: |
          whoami
          pwd
          uname -a
          ls -la

      - name: Probar el script de backup
        env:
          ORIGEN: ${{ github.workspace }}/lab6/datos
          DESTINO: ${{ runner.temp }}/backups
        run: |
          chmod +x lab6/backup.sh
          ./lab6/backup.sh
          ls -l "$DESTINO"
          tar -tzf "$DESTINO"/backup-*.tar.gz
